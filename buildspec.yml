version: 0.2

env:
  parameter-store:
    SSH_PRIVATE_KEY: "/devops/sshkey"
    DOCKER_USERNAME: "/devops/docker/username"
    DOCKER_TOKEN: "/devops/docker/token"

phases:

  install:
    commands:
      - echo "Installing SSH key"
      - mkdir -p ~/.ssh
      - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
      - chmod 400 ~/.ssh/id_rsa
      - ssh-keyscan -H 54.81.17.152 >> ~/.ssh/known_hosts

      - echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USERNAME" --password-stdin

  build:
    commands:
      - echo "Starting deployment to EC2"

      # 🔥 IMPORTANT FIX: correct EC2 folder
      - ssh -i ~/.ssh/id_rsa ubuntu@54.81.17.152 "
          set -e &&
          cd /home/ubuntu/react-nodejs-mysql &&
          bash -x ./scripts/deploy.sh
        "

artifacts:
  files:
    - '**/*'
