version: '3.8'

services:
  bezkoder-api:
    build: ./bezkoder-api
    restart: unless-stopped
    env_file: ./.env
    ports:
      - $NODE_LOCAL_PORT:$NODE_DOCKER_PORT
    environment:
      - DB_HOST=devops-mysql-db.cezus2e20mq5.us-east-1.rds.amazonaws.com
      - DB_USER=admin
      - DB_PASSWORD=Password123
      - DB_NAME=devopsdb
      - DB_PORT=3306
      - CLIENT_ORIGIN=$CLIENT_ORIGIN
    networks:
      - backend
      - frontend

  bezkoder-ui:
    depends_on:
      - bezkoder-api
    build:
      context: ./bezkoder-ui
      args:
        - REACT_APP_API_BASE_URL=$CLIENT_API_BASE_URL
    ports:
      - $REACT_LOCAL_PORT:$REACT_DOCKER_PORT
    networks:
      - frontend  


networks:
  backend:
  frontend:
